[workspace]
members = ["crates/domain", "crates/application", "crates/infrastructure", "crates/api"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
# Runtime e HTTP
async-stream = "0.3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["request-id", "trace", "cors", "limit", "timeout", "set-header"] }

# Persistência
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate"] }

# Serialização e erros
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Domínio e casos de uso
async-trait = "0.1"
argon2 = { version = "0.5", features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Estado distribuído e observabilidade
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
prometheus = "0.14"

# Configuração e observabilidade
anyhow = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Crates internos
application = { path = "crates/application" }
domain = { path = "crates/domain" }
infrastructure = { path = "crates/infrastructure" }

[workspace.lints.rust]
unsafe_code = "forbid"
# Exige documentação (`///` ou `//!`) em todo item público do crate.
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
# Exige documentação também em itens privados: funções auxiliares, campos,
# constantes e variantes de enum.
missing_docs_in_private_items = "warn"
